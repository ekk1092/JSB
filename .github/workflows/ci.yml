name: CI

on:
  push:
    branches: [main, offmavins]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Syntax check
        run: |
          python -m py_compile server/main.py server/tools/jobs.py server/tools/resume.py server/tools/web_scraper.py client_streamlit/app.py client_streamlit/prompts.py